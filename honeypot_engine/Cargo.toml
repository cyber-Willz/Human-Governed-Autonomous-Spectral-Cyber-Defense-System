[package]
name = "honeypot_engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Production honeypot suite (SSH, multi-port TCP, honeytokens) feeding active_spectral_defense SIEM correlation"

[[bin]]
name = "honeypotd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "fs", "signal"] }
russh = "0.44"
russh-keys = "0.44"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
notify = "6"
rand = "0.8"
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
async-trait = "0.1"
bytes = "1"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true
