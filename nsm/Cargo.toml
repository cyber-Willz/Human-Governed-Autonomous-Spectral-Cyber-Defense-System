[package]
name = "nsm"
version = "0.1.0"
edition = "2021"
description = "Lightweight Network Security Monitor (NSM) in Rust"

# `nsm` used to be its own two-member workspace root (this package plus
# `xdp/nsm-common`, which is shared with the standalone, nightly-only
# `xdp/nsm-ebpf` crate) -- see that crate's Cargo.toml for why
# `nsm-ebpf` deliberately excludes itself with an empty `[workspace]`
# table. Now that `nsm` is itself a member of the top-level unified
# workspace, that inner `[workspace]` table was removed (Cargo doesn't
# allow a workspace member to also be its own workspace root) and
# `xdp/nsm-common` was added directly to the top-level workspace's
# `members` instead, preserving the "one lockfile" property the
# original design wanted. `xdp/nsm-ebpf` remains excluded exactly as
# before -- its own empty `[workspace]` table is unaffected by any of
# this.

[[bin]]
name = "nsm"
path = "src/main.rs"

[dependencies]
pnet = "0.34"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "5.5"
once_cell = "1.19"
nsm-common = { path = "xdp/nsm-common" }
bytemuck = "1.14"

# aya (and its bpf-syscall-based userspace loader) only builds on
# Linux; kept target-scoped and optional so `cargo build` on macOS/
# Windows never touches it, `--xdp` CLI flags disappear from `--help`
# there, and the pnet capture path remains the only option.
[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "0.13", optional = true }

[features]
# Off by default: enabling it on Linux pulls in aya and compiles
# src/xdp/mod.rs + the --xdp* CLI flags. It does NOT build the eBPF
# object itself -- that's `scripts/build-ebpf.sh`, run separately with
# a nightly toolchain (see README "Building the eBPF/XDP program").
xdp = ["dep:aya"]

[profile.release]
opt-level = 3
lto = true
