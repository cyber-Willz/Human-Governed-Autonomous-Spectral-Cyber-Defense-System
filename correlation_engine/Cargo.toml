[package]
name = "correlation_engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "SIEM correlation fan-in: fuses XDP/rustfirewall, ClamAV, spectral-autoencoder, hypergraph-window, and honeytoken-touch lane events per host into CorrelationVerdicts, annotated with distance-to-nearest-confirmed-incident via siem_event_index."

[dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "sync", "time", "macros"] }
thiserror = "1"
tracing = "0.1"
siem_event_index = { path = "../siem_event_index" }
nsm = { path = "../nsm" }
serde_json = "1.0"
