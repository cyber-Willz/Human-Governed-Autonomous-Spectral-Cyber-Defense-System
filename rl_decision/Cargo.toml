[package]
name = "rl_decision"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Reinforcement-learning decision layer between the correlation engine and the IPS control plane: sandbox simulator, calibrated risk model, policy network, shielded action selection, reward ledger and guarded continuous learning. Pure Rust, no ML framework dependency."

[dependencies]
correlation_engine = { path = "../correlation_engine" }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
